name: Feature request
description: Suggest an improvement to Meu.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what would make Meu more useful. English and Greek suggestions are welcome.
        Search existing issues first. Use Discussions if you would like to explore an idea with other users.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe a real task or difficulty this improvement would address.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Meu help? (optional)
      description: Describe the behavior you would like to see.
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround (optional)
      description: Tell us how you handle this today, if you have a workaround.
