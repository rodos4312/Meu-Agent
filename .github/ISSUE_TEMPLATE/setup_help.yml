name: Installation or update help
description: Get help installing, starting, updating or configuring Meu.
title: "[Setup]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        English and Greek questions are welcome.
        Use the installer from https://github.com/rodos4312/Meu-Agent/releases.
        Remove API keys, tokens and personal information before sharing screenshots or log excerpts. No automatic diagnostic upload is needed.
  - type: input
    id: version
    attributes:
      label: Meu version or installer filename
      placeholder: "For example: Meu-0.1.0-dev.22-win-x64.exe"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Where did setup or the update stop?
      description: Include the visible error message and what you were trying to do.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What have you tried? (optional)
      description: Describe any retry, repair or configuration changes you have already tried.
  - type: input
    id: windows
    attributes:
      label: Windows version (optional)
      placeholder: "For example: Windows 11"
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or log excerpt (optional)
      description: Use a short excerpt from the install screen or Open logs, after checking it for private information.
