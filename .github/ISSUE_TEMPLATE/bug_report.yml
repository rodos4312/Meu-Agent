name: Bug report
description: Report a crash, an incorrect result or a feature that does not work in Meu.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Meu. English and Greek reports are welcome.
        Search existing issues first. Remove API keys, tokens, private conversations and personal information from anything you post.
  - type: input
    id: version
    attributes:
      label: Meu version
      description: Find this in Settings → About → Version & updates.
      placeholder: "For example: 0.1.0-dev.22"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Meu and...
        2. Choose...
        3. The problem appears when...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System, provider and model (optional)
      description: Include your Windows version and selected model if relevant. Never include your API key.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or log excerpt (optional)
      description: Share only a short, relevant excerpt that you have checked for private information. No diagnostic upload is required.
