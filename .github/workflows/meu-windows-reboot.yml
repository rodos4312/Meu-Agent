name: Meu Windows reboot transport probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    if: github.repository == 'rodos4312/Meu-Agent' && github.ref == 'refs/heads/dev/meu-foundation'
    runs-on: windows-latest
    timeout-minutes: 12
    # Reboot intentionally destroys this job's process. The independent controller
    # must receive and validate a post-boot receipt for the workflow to pass.
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: ./scripts/meu/reboot-worker.ps1 -Stage prepare
        shell: pwsh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meu-reboot-public-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meu-reboot-public/
          retention-days: 1
      - run: ./scripts/meu/reboot-worker.ps1 -Stage reboot
        shell: pwsh
  controller:
    if: github.repository == 'rodos4312/Meu-Agent' && github.ref == 'refs/heads/dev/meu-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python scripts/meu/reboot_controller.py handoff "$RUNNER_TEMP/meu-reboot-controller"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meu-reboot-envelope-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meu-reboot-controller/envelope.bin
          retention-days: 1
      - run: python scripts/meu/reboot_controller.py wait "$RUNNER_TEMP/meu-reboot-controller"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Meu-Windows-reboot-receipt
          path: ${{ runner.temp }}/meu-reboot-controller/receipt.json
          if-no-files-found: ignore
          retention-days: 30
