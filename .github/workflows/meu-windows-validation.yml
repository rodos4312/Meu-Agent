name: Meu Windows validation

on:
  push:
    branches:
      - dev/meu-foundation
    paths:
      - 'apps/desktop/**'
      - 'tools/**'
      - 'scripts/install.ps1'
      - 'agent/subagent_lifecycle.py'
      - 'hermes_cli/**'
      - 'tui_gateway/**'
      - 'gateway/**'
      - 'tests/gateway/test_meu_memory_commands.py'
      - 'tests/tools/test_memory_tool.py'
      - 'tests/hermes_cli/test_meu_privacy.py'
      - 'tests/tui_gateway/test_meu_privacy_rpc.py'
      - 'tests/agent/test_meu_deepseek_privacy.py'
      - 'tests/scripts/install/test_meu_installer_privacy.py'
      - 'scripts/install.sh'
      - 'tests/tools/test_meu_*.py'
      - '.github/workflows/meu-windows-validation.yml'
      - 'scripts/msix-shared.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-privacy:
    name: Meu privacy, memory and DeepSeek on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Meu development branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare locked Python test environment
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
          packages: git,ripgrep
      - name: Verify telemetry stays disabled and DeepSeek tool calls work
        shell: bash
        run: >-
          scripts/run_tests.sh -j 2
          tests/hermes_cli/test_meu_privacy.py
          tests/tui_gateway/test_meu_privacy_rpc.py
          tests/scripts/install/test_meu_installer_privacy.py
          tests/agent/test_meu_deepseek_privacy.py
          tests/agent/test_deepseek_reasoning_content_echo.py
          tests/plugins/model_providers/test_deepseek_profile.py
          tests/hermes_cli/test_shared_metrics_consent_windows.py
          tests/hermes_cli/test_shared_metrics_send_migration.py
          tests/agent/test_retry_delay_parsers_shared.py
          tests/tools/test_meu_memory_lifecycle.py
          tests/tools/test_memory_tool.py
          tests/tools/test_memory_patch_action.py
          tests/gateway/test_meu_memory_commands.py
          tests/hermes_cli/test_desktop_slash_registry.py
          tests/agent/test_redact.py
          tests/agent/test_secret_scope.py
          tests/tools/test_approval_mode_parity.py
          tests/tools/test_computer_use_approval_isolation.py
          -- --override-ini=addopts= -q

  windows-identity-and-safety:
    name: Meu identity and isolation on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Meu development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up Python for backend syntax checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check delegation Python modules compile
        run: python -m compileall -q tools/delegate_tool_config.py tools/delegate_tool.py tools/meu_limits.py agent/subagent_lifecycle.py tests/tools/test_meu_delegation_depth.py tests/tools/test_meu_concurrency.py
      - name: Verify Meu child concurrency and exception handling
        run: python -m unittest discover -s tests/tools -p test_meu_gate_stdlib.py -v
      - name: Parse Meu Windows installer PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('scripts/install.ps1', 'apps/desktop/scripts/test-meu-installer.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Check Meu desktop identity
        run: node apps/desktop/scripts/test-meu-brand.cjs
      - name: Check separate data roots
        run: node apps/desktop/scripts/test-meu-isolation.mjs
      - name: Run relevant native desktop regression tests
        working-directory: apps/desktop
        run: npx vitest run --project electron electron/product-identity.test.ts electron/data-paths.test.ts electron/bootstrap-single-flight.test.ts electron/desktop-shared-metrics.test.ts scripts/set-exe-identity.test.mjs scripts/after-extract.test.mjs electron/external-open.test.ts electron/preview-guest-escape.test.ts
      - name: Test Meu first-run setup interface
        working-directory: apps/desktop
        run: npx vitest run --project ui src/components/desktop-install-overlay.test.tsx src/components/chat/intro.test.tsx
      - name: Verify Desktop never collects or offers usage statistics
        working-directory: apps/desktop
        run: npx vitest run --project ui src/store/desktop-metrics.test.ts src/store/shared-metrics.test.ts src/app/settings/shared-metrics-settings.test.tsx src/components/shared-metrics/consent-dialog.test.tsx src/components/shared-metrics/consent-strip.test.tsx src/app/gateway/report-startup-latency.test.ts
      - name: Verify localization and memory command usability
        working-directory: apps/desktop
        run: npx vitest run --project ui --maxWorkers 2 src/i18n src/lib/desktop-slash-commands.test.ts
      - name: Typecheck desktop and Electron
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Build Meu desktop renderer and backend shell
        working-directory: apps/desktop
        run: npm run build
      - name: Package unsigned portable Meu Windows preview
        working-directory: apps/desktop
        run: npm run builder -- --win --x64 --dir
      - name: Package unsigned Meu Windows installer
        working-directory: apps/desktop
        run: npm run builder -- --win nsis --x64
      - name: Upload Meu installer for manual Windows testing
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Windows-x64-installer-unsigned-preview
          path: apps/desktop/release/Meu-*-win-x64.exe
          if-no-files-found: error
          retention-days: 7
      - name: Smoke-test Meu installer and desktop shortcuts
        shell: pwsh
        working-directory: apps/desktop
        run: ./scripts/test-meu-installer.ps1
      - name: Preserve packaged launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Meu-Windows-renderer-launch-evidence
          path: ${{ runner.temp }}/meu-renderer-smoke/meu-launch-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unpacked preview for review only
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Windows-x64-preview-unsigned
          path: apps/desktop/release/win-unpacked/
          if-no-files-found: error
          retention-days: 7
