  windows-identity-and-safety:
    name: Meu identity and isolation on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Admit signing only for the Meu development branch
        if: env.MEU_RELEASE_REQUEST == 'true'
        shell: pwsh
        env:
          MEU_REPOSITORY: ${{ github.repository }}
          MEU_REF: ${{ github.ref }}
        run: |
          if ($env:MEU_REPOSITORY -cne 'rodos4312/Meu-Agent' -or ($env:MEU_REF -cne 'refs/heads/dev/meu-foundation' -and $env:MEU_REF -notlike 'refs/tags/meu-release-request-*')) {
            throw 'Signed release preparation is restricted to rodos4312/Meu-Agent dev/meu-foundation.'
          }
      - name: Checkout Meu development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
      - name: Verify signed release source ancestry and requested version
        if: env.MEU_RELEASE_REQUEST == 'true'
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/dev/meu-foundation
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not admitted by dev/meu-foundation.' }
          $version = (Get-Content -LiteralPath apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "meu-release-request-$version") { throw 'Release request tag does not match package version.' }
          $request = git log -1 --format=%s
          if ($request.StartsWith('release(meu): prepare ') -and $request -cne "release(meu): prepare $version") { throw 'Release request commit does not match package version.' }
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the terminal renderer
        run: npm run build:ink --prefix ui-tui
      - name: Verify terminal types on Windows
        working-directory: ui-tui
        run: npm run typecheck
      - name: Verify terminal behavior on Windows
        working-directory: ui-tui
        run: npm test -- --maxWorkers 2
      - name: Verify web types on Windows
        working-directory: web
        run: npm run typecheck
      - name: Verify web behavior on Windows
        working-directory: web
        run: npm test -- --maxWorkers 2
      - name: Set up Python for backend syntax checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check delegation Python modules compile
        run: python -m compileall -q tools/delegate_tool_config.py tools/delegate_tool.py tools/meu_limits.py agent/subagent_lifecycle.py tests/tools/test_meu_delegation_depth.py tests/tools/test_meu_concurrency.py
      - name: Verify Meu child concurrency and exception handling
        run: python -m unittest discover -s tests/tools -p test_meu_gate_stdlib.py -v
      - name: Parse Meu Windows installer PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('scripts/install.ps1', 'apps/desktop/scripts/test-meu-installer.ps1', 'apps/desktop/scripts/test-meu-native-upgrade.ps1', 'apps/desktop/scripts/test-meu-rollback.ps1', 'apps/desktop/scripts/scan-meu-package.ps1', 'apps/desktop/scripts/create-meu-update-key.ps1', 'apps/desktop/scripts/configure-meu-update-key.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Check Meu desktop identity
        run: node apps/desktop/scripts/test-meu-brand.cjs
      - name: Check separate data roots
        run: node apps/desktop/scripts/test-meu-isolation.mjs
      - name: Run relevant native desktop regression tests
        working-directory: apps/desktop
        run: npx vitest run --project electron electron/meu-runtime-upgrade.test.ts electron/bootstrap-runner.test.ts electron/product-identity.test.ts electron/data-paths.test.ts electron/bootstrap-single-flight.test.ts electron/bootstrap-state.test.ts electron/bootstrap-transitions.test.ts electron/backend-health.test.ts electron/remote-oauth-ticket.test.ts electron/connection-config.test.ts electron/preload-version-scope.test.ts electron/app-version.test.ts electron/local-runtime-version.test.ts electron/window-renderer-lifecycle.test.ts scripts/set-exe-identity.test.mjs scripts/after-extract.test.mjs electron/external-open.test.ts electron/preview-guest-escape.test.ts
      - name: Test Meu first-run setup interface
        working-directory: apps/desktop
        run: npx vitest run --project ui --maxWorkers 2 src/components/desktop-install-overlay.test.tsx src/components/chat/intro.test.tsx src/components/boot-failure-overlay.test.tsx src/lib/desktop-backend-wait.test.ts src/lib/with-timeout.test.ts src/app/gateway/hooks/use-gateway-boot.bootstrap.test.tsx src/app/gateway/hooks/use-gateway-boot.test.tsx
      - name: Verify Meu release origin, signatures and update recovery
        working-directory: apps/desktop
        run: npx vitest run --project electron --maxWorkers 2 electron/updater/meu-release-feed.test.ts electron/updater/meu-key-updates.test.ts electron/updater/meu-signature.test.ts electron/updater/meu-windows.test.ts electron/updater/meu-recovery.test.ts electron/updater/meu-client.test.ts electron/updater/meu-prepare.test.ts electron/updater/meu-rollback.test.ts electron/updater/operation.test.ts scripts/prepare-meu-release.test.mjs scripts/write-build-stamp.test.mjs
      - name: Verify installed-home isolation and upgrade setup behavior
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $env:HERMES_PYTHON = (Get-Command python).Source
          npx vitest run --project electron --maxWorkers 2 electron/source-backend-home.test.ts electron/first-run-setup-gate.test.ts electron/meu-runtime-upgrade.test.ts electron/pre-update-backup-config.test.ts electron/updater/state-db-preflight.test.ts
      - name: Verify update notification and consent behavior
        working-directory: apps/desktop
        run: npx vitest run --project ui --maxWorkers 2 src/store/meu-updates.test.ts src/store/updates.test.ts src/components/update-status.test.tsx src/app/updates-overlay.manual.test.tsx src/lib/update-notes.test.ts
      - name: Verify removed Nous surfaces and provider credential recovery
        working-directory: apps/desktop
        run: npx vitest run --project ui --maxWorkers 2 src/app/settings/moved-tabs.test.ts src/components/onboarding/index.test.tsx src/store/billing-block.test.ts src/lib/error-surface.test.ts src/components/error-boundary.test.tsx src/app/contrib/wiring-background-queue-drain.test.tsx src/app/session/hooks/use-message-stream/gateway-event/status.test.ts
      - name: Verify remote connections after removing Nous Cloud
        working-directory: apps/desktop
        run: >-
          npx vitest run --project ui --maxWorkers 2
          src/app/settings/gateway-settings.test.ts
          src/app/settings/gateway-settings.test.tsx
          src/app/settings/connections-registry.test.tsx
          src/lib/browser-desktop-bridge.test.ts
      - name: Verify gateway OAuth without Portal sessions
        working-directory: apps/desktop
        run: >-
          npx vitest run --project electron --maxWorkers 2
          electron/oauth-login-window.test.ts
          electron/oauth-login-flights.test.ts
          electron/oauth-partition.test.ts
          electron/connection-registry.test.ts
      - name: Verify Desktop never collects or offers usage statistics
        working-directory: apps/desktop
        run: npx vitest run --project ui src/app/session/hooks/use-prompt-actions/index.test.tsx src/app/session/hooks/use-prompt-actions/submission-destination.test.tsx src/store/notifications.test.ts src/components/version-details.test.tsx src/app/settings/about-settings.test.tsx
      - name: Verify localization and memory command usability
        working-directory: apps/desktop
        run: npx vitest run --project ui --maxWorkers 2 src/i18n src/lib/desktop-slash-commands.test.ts
      - name: Verify setup and local tools without Nous free-tier flows
        working-directory: apps/desktop
        run: >-
          npx vitest run --project ui --maxWorkers 2
          src/store/onboarding.test.ts
          src/app/shell/hooks/use-status-snapshot.test.ts
          src/app/session/hooks/use-message-stream/gateway-event/lifecycle.test.ts
          src/app/session/hooks/use-message-stream/gateway-event/message-stream.test.ts
          src/app/capabilities/connectors/data/persist.test.ts
          src/components/assistant-ui/connector-directory-card.test.tsx
          src/lib/connector-tools.test.ts
      - name: Verify local catalogs without hosted Nous pages
        working-directory: apps/desktop
        run: >-
          npx vitest run --project ui --maxWorkers 2
          src/plugins/hermes-bots/skills-hub-picker.test.tsx
          src/lib/plugin-catalog.test.ts
          src/store/plugin-catalog-install.test.ts
          src/app/capabilities/catalog/catalog-data.test.ts
          src/app/settings/web-access-settings.test.tsx
          src/app/messaging/index.test.tsx
      - name: Verify desktop policy after removing the hosted hub
        working-directory: apps/desktop
        run: npx vitest run --project electron --maxWorkers 2 electron/window-open-policy.test.ts electron/remote-lifecycle.test.ts electron/update-stop-remedy.test.ts
      - name: Verify model credentials and Auto behavior
        working-directory: apps/desktop
        run: npx vitest run --project ui --maxWorkers 2 src/app/settings/model-settings.test.tsx src/app/settings/providers-settings.test.tsx src/app/settings/web-access-settings.test.tsx src/app/session/hooks/use-model-controls.test.tsx src/lib/model-status-label.test.ts src/plugins/hermes-bots/routing.test.ts src/plugins/hermes-bots/model-picker.test.tsx src/plugins/hermes-bots/bot-row-opens-canonical-chat.test.ts src/app/command-center/open-session.test.tsx
      - name: Verify Coordinator model preferences
        working-directory: apps/desktop
        run: npx vitest run --project ui --maxWorkers 2 src/app/settings/delegation/routing-section.test.tsx
      - name: Verify Meu navigation, chat history and customization pages
        working-directory: apps/desktop
        run: npx vitest run --project ui --maxWorkers 2 src/app/shell/meu-navigation.test.tsx src/app/chat/sidebar/chat-sidebar.integration.test.tsx src/app/capabilities/index.test.tsx src/app/capabilities/plugins/plugins-tab.test.tsx src/app/capabilities/skills/skill-provenance.test.ts src/app/capabilities/skills/frontmatter.test.ts
      - name: Verify project progress, web sources and translation coverage
        working-directory: apps/desktop
        run: |
          node scripts/i18n-keys.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run --project ui --maxWorkers 2 src/app/chat/sidebar/projects/coordinator-workspace.test.tsx src/app/chat/sidebar/projects/project-memory.test.tsx src/store/projects.test.ts src/components/assistant-ui/thread/sealed-tool-parts.test.tsx src/i18n/catalog-completeness.test.ts src/i18n/overlay-completeness.test.ts
      - name: Typecheck desktop and Electron
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Build Meu desktop renderer and backend shell
        working-directory: apps/desktop
        run: npm run build
      - name: Package Meu Windows application
        working-directory: apps/desktop
        run: npm run builder -- --win --x64 --dir
      - name: Package Meu Windows installer
        working-directory: apps/desktop
        run: npm run builder -- --win nsis --x64
      - name: Scan Meu installer and unpacked application before upload
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter 'Meu-*-win-x64.exe' -File
          if (@($installer).Count -ne 1) { throw 'Expected exactly one Meu installer.' }
          ./scripts/scan-meu-package.ps1 -PackagePath $installer.FullName -ReportDirectory release/security -UnpackedPath release/win-unpacked
      - name: Prove an unsigned preview cannot pass the signed-release gate
        if: env.MEU_RELEASE_REQUEST != 'true'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter 'Meu-*-win-x64.exe' -File
          $refused = $false
          try {
            ./scripts/scan-meu-package.ps1 -PackagePath $installer.FullName -ReportDirectory release/security-negative -ExpectedPublisher 'CN=Meu CI refusal fixture'
          } catch {
            if ($_.Exception.Message -notlike '*signature*') { throw }
            $refused = $true
          }
          if (-not $refused) { throw 'Unsigned preview unexpectedly passed the release signature gate.' }
          Write-Host '[PASS] Unsigned preview was refused by the signed-release gate.'
      - name: Preserve package scan and checksum evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Meu-Windows-package-security-evidence
          path: apps/desktop/release/security/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Meu installer for manual Windows testing
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Windows-x64-installer-unsigned-preview
          path: apps/desktop/release/Meu-*-win-x64.exe
          if-no-files-found: error
          retention-days: 7
      - name: Smoke-test Meu installer and desktop shortcuts
        shell: pwsh
        working-directory: apps/desktop
        run: ./scripts/test-meu-installer.ps1
      - name: Prepare Meu release with free update signature
        if: env.MEU_RELEASE_REQUEST == 'true'
        working-directory: apps/desktop
        env:
          MEU_RELEASE_PRIVATE_KEY: ${{ secrets.MEU_RELEASE_PRIVATE_KEY }}
        run: node scripts/prepare-meu-release.mjs
      - name: Upload Meu release candidate
        if: env.MEU_RELEASE_REQUEST == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Meu-release-candidate
          path: apps/desktop/release/meu-release-candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve packaged launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Meu-Windows-renderer-launch-evidence
          path: ${{ runner.temp }}/meu-renderer-smoke/meu-launch-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unpacked preview for review only
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Windows-x64-preview-unsigned
          path: apps/desktop/release/win-unpacked/
          if-no-files-found: error
          retention-days: 7

  backend-upgrade:
    name: Real pinned Meu backend upgrade on Windows
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rehearse installed backend and canonical gateway transition
        shell: pwsh
        run: ./apps/desktop/scripts/test-meu-backend-upgrade.ps1
      - name: Preserve backend upgrade evidence without profile contents
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Meu-Windows-backend-upgrade-evidence
          path: |
            ${{ runner.temp }}/meu-backend-upgrade/*.log
            ${{ runner.temp }}/meu-backend-upgrade/result.json
          if-no-files-found: ignore
          retention-days: 30

  native-upgrade:
    name: Real Meu Windows upgrade and data preservation
    if: >-
      (inputs.verify_upgrade || inputs.prepare_release || startsWith(github.ref, 'refs/tags/meu-release-request-') || (github.ref == 'refs/heads/dev/meu-foundation' && startsWith(github.event.head_commit.message, 'release(meu): prepare '))) && github.repository == 'rodos4312/Meu-Agent'
    needs: [installer-consolidation, coordinator-compatibility, windows-navigation, windows-privacy, windows-identity-and-safety]
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare locked native rehearsal tools
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
      - name: Install locked rehearsal dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the pinned public dev.21 baseline
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'meu-baseline-candidate'
          New-Item -ItemType Directory -Path $baseline | Out-Null
          $release = 'https://github.com/rodos4312/Meu-Agent/releases/download/meu-v0.1.0-dev.21'
          foreach ($file in @('meu-release.json', 'Meu-0.1.0-dev.21-win-x64.exe')) {
            Invoke-WebRequest -Uri "$release/$file" -OutFile (Join-Path $baseline $file) -TimeoutSec 180
          }
          # The rehearsal driver verifies the manifest signature and installer hashes before execution.
      - name: Download the newly signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Meu-release-candidate
          path: ${{ runner.temp }}/meu-target-candidate
      - name: Rehearse real native refusal, download, NSIS upgrade and restart
        shell: pwsh
        run: ./apps/desktop/scripts/test-meu-native-upgrade.ps1
      - name: Preserve native upgrade evidence without profile contents
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Meu-Windows-native-upgrade-evidence
          path: |
            ${{ runner.temp }}/meu-native-upgrade/*.json
            ${{ runner.temp }}/meu-native-upgrade/*.png
            ${{ runner.temp }}/meu-native-upgrade/*.log
          if-no-files-found: ignore
          retention-days: 30

  automatic-rollback:
    name: Real failed startup and automatic Meu rollback
    if: >-
      (inputs.verify_upgrade || inputs.prepare_release || startsWith(github.ref, 'refs/tags/meu-release-request-') || (github.ref == 'refs/heads/dev/meu-foundation' && startsWith(github.event.head_commit.message, 'release(meu): prepare '))) && github.repository == 'rodos4312/Meu-Agent'
    needs: [installer-consolidation, coordinator-compatibility, windows-navigation, windows-privacy, windows-identity-and-safety]
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Meu-release-candidate
          path: ${{ runner.temp }}/meu-rollback-baseline
      - name: Build a private next-version failure fixture, never publish it
        working-directory: apps/desktop
        shell: pwsh
        run: ./scripts/build-meu-rollback-fixture.ps1
      - name: Sign only the private fixture metadata
        working-directory: apps/desktop
        env:
          MEU_RELEASE_PRIVATE_KEY: ${{ secrets.MEU_RELEASE_PRIVATE_KEY }}
        run: node scripts/prepare-meu-release.mjs
      - name: Rehearse actual application, gateway and SQLite rollback
        shell: pwsh
        run: ./apps/desktop/scripts/test-meu-rollback.ps1
      - name: Preserve bounded recovery evidence without profile contents or installers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Meu-Windows-automatic-rollback-evidence
          path: |
            ${{ runner.temp }}/meu-rollback/*.json
            ${{ runner.temp }}/meu-rollback/*.log
          if-no-files-found: ignore
          retention-days: 30

  release-draft:
    name: Prepare a draft in Meu GitHub Releases
    if: >-
      (inputs.prepare_release || startsWith(github.ref, 'refs/tags/meu-release-request-') || (github.ref == 'refs/heads/dev/meu-foundation' && startsWith(github.event.head_commit.message, 'release(meu): prepare '))) && github.repository == 'rodos4312/Meu-Agent'
    needs: [installer-consolidation, coordinator-compatibility, windows-navigation, windows-privacy, windows-identity-and-safety, native-upgrade, backend-upgrade, automatic-rollback]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Meu-release-candidate
          path: candidate
      - name: Create reviewable release draft, never publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: rodos4312/Meu-Agent
          MEU_COMMIT: ${{ github.sha }}
        run: |
          version=$(jq -er '.version' candidate/meu-release.json)
          commit=$(jq -er '.commit' candidate/meu-release.json)
          test "$commit" = "$MEU_COMMIT"
          tag="meu-v$version"
          gh release create "$tag" candidate/* --draft --prerelease --target "$MEU_COMMIT" --title "Meu $version" --notes 'Meu Windows candidate verified with our free update key. All required CI checks and package scans passed. Awaiting upgrade/recovery rehearsal before publication. No commercial Windows certificate.'
