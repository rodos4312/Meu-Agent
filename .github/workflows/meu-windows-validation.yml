name: Meu Windows validation

on:
  push:
    branches:
      - dev/meu-foundation
    tags:
      - 'meu-release-request-*'
    paths:
      - 'apps/desktop/**'
      - 'apps/shared/**'
      - 'optional-mcps/mt5-httpapi-read/**'
      - 'ui-tui/**'
      - 'web/**'
      - 'locales/**'
      - 'tools/**'
      - 'pm/**'
      - 'tests/pm/test_artifact_mirror.py'
      - 'tests/tools/test_mcp_cimd.py'
      - 'tests/hermes_cli/test_meu_independent_identity.py'
      - 'tests/scripts/test_bootstrap_mirror.py'
      - 'scripts/install.ps1'
      - 'agent/**'
      - 'model_tools.py'
      - 'utils.py'
      - 'tests/tools/test_model_tools.py'
      - 'tests/hermes_cli/test_file_cache_same_tick_rewrite.py'
      - 'providers/**'
      - 'plugins/model-providers/deepseek/**'
      - 'plugins/delegation/**'
      - 'plugins/browser/**'
      - 'tests/plugins/delegation/**'
      - 'tests/agent/test_delegation*.py'
      - 'tests/tools/test_delegation*.py'
      - 'hermes_cli/**'
      - 'tui_gateway/**'
      - 'gateway/**'
      - 'tests/gateway/test_meu_memory_commands.py'
      - 'tests/tools/test_memory_tool.py'
      - 'tests/tools/test_project_memory.py'
      - 'tests/tui_gateway/test_project_memory*.py'
      - 'tests/hermes_cli/test_meu_privacy.py'
      - 'tests/hermes_cli/test_meu_setup_commands.py'
      - 'tests/hermes_cli/test_meu_retired_login.py'
      - 'tests/hermes_cli/test_setup_quick_import.py'
      - 'tests/hermes_cli/test_meu_config_without_feature_metrics.py'
      - 'tests/hermes_cli/test_meu_removed_metrics_routes.py'
      - 'tests/tui_gateway/test_meu_removed_metrics.py'
      - 'tests/tui_gateway/test_meu_removed_payments.py'
      - 'tests/tui_gateway/test_meu_retired_free_tier.py'
      - 'tests/agent/test_meu_deepseek_privacy.py'
      - 'tests/scripts/install/test_meu_installer_privacy.py'
      - 'tests/scripts/install/test_meu_pinned_upgrade.py'
      - 'scripts/install.sh'
      - 'tests/tools/test_meu_*.py'
      - '.github/workflows/meu-windows-validation.yml'
      - 'scripts/msix-shared.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      verify_upgrade:
        description: 'Build a CI candidate and rehearse real upgrade without a release draft'
        required: false
        type: boolean
        default: false
      prepare_release:
        description: 'Build a Meu release draft using our free update key (no paid certificate)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  MEU_RELEASE_REQUEST: >-
    ${{ inputs.verify_upgrade || inputs.prepare_release || startsWith(github.ref, 'refs/tags/meu-release-request-') || (github.ref == 'refs/heads/dev/meu-foundation' && startsWith(github.event.head_commit.message, 'release(meu): prepare ')) }}

jobs:
  installer-consolidation:
    name: Single Meu installer and CI routing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
      - name: Verify remaining build graph and rehearsal gates
        shell: bash
        run: >-
          scripts/run_tests.sh -j 3 --file-timeout 600 --file-retries 0
          tests/ci/test_classify_changes.py
          tests/ci/test_update_ci_routing.py
          tests/ci/test_stable_release_graph.py
          tests/ci/test_meu_upgrade_dispatch.py
          tests/scripts/test_version_stamping.py
          tests/scripts/test_stable_release.py
          tests/scripts/test_release_entrypoint.py
          tests/scripts/test_icon_generation_exit.py
          tests/scripts/test_icon_flavors.py
          -- --override-ini=addopts= -q

  coordinator-compatibility:
    name: Coordinator plugin compatibility on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Meu development branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare locked Python tests
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["acp"]'
          test-environment: 'true'
      - name: Verify coordinator, hosted plugins and routing scope
        shell: bash
        run: >-
          scripts/run_tests.sh -j 2
          tests/plugins/delegation/test_meu_coordinator.py
          tests/plugins/delegation/test_meu_projects.py
          tests/plugins/delegation/test_meu_project_memory.py
          tests/plugins/delegation/test_meu_project_reviews.py
          tests/plugins/delegation/test_meu_project_rehearsal.py
          tests/tools/test_local_agent_context.py
          tests/tools/test_delegation_backends.py
          tests/tools/test_delegation_profile_route.py
          tests/tools/test_delegation_model_pin.py
          tests/agent/test_delegation_switch_next_session.py
          tests/hermes_cli/test_plugin_host_delegation.py
          tests/hermes_cli/test_web_delegation_routing.py
          tests/gateway/test_meu_session_auto.py
          tests/gateway/test_session_mutation_model.py
          -- --override-ini=addopts= -q
      - name: Install locked terminal dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the terminal renderer
        run: npm run build:ink --prefix ui-tui
      - name: Verify terminal types on Linux
        working-directory: ui-tui
        run: npm run typecheck
      - name: Verify terminal behavior on Linux
        working-directory: ui-tui
        run: npm test -- --maxWorkers 2

  windows-navigation:
    name: Meu navigation with an isolated Windows backend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Meu development branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare locked desktop and Python toolchains
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          packages: git,ripgrep
      - name: Install locked desktop dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Meu desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Verify navigation, draft retention and responsive layout
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $env:HERMES_DESKTOP_PYTHON = $env:HERMES_PYTHON
          npx playwright test e2e/meu-navigation.spec.ts e2e/meu-coordinator.spec.ts e2e/meu-project-memory.spec.ts e2e/meu-auto.spec.ts e2e/meu-updates.spec.ts e2e/meu-provider-cleanup.spec.ts --reporter=list --workers=1
      - name: Preserve navigation screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Meu-Windows-navigation-evidence
          path: apps/desktop/test-results/**/meu-*.png
          if-no-files-found: ignore
          retention-days: 7

