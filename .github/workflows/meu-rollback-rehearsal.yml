name: Meu rollback diagnostic (unpublished)

on:
  push:
    branches: [dev/meu-foundation]
    paths: [.github/workflows/meu-rollback-rehearsal.yml]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Meu Windows validation run containing a signed baseline installer'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  automatic-rollback:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'rodos4312/Meu-Agent' && github.ref == 'refs/heads/dev/meu-foundation'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [startup-failure, guardian-loss, locked-package, interrupted-install]
    name: Recovery / ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Meu-release-candidate
          path: ${{ runner.temp }}/meu-rollback-baseline
          run-id: ${{ inputs.candidate_run_id }}
          repository: rodos4312/Meu-Agent
          github-token: ${{ github.token }}
      - name: Build the unpublished next-version fixture
        working-directory: apps/desktop
        shell: pwsh
        run: ./scripts/build-meu-rollback-fixture.ps1
      - name: Sign only fixture metadata
        working-directory: apps/desktop
        env:
          MEU_RELEASE_PRIVATE_KEY: ${{ secrets.MEU_RELEASE_PRIVATE_KEY }}
        run: node scripts/prepare-meu-release.mjs
      - name: Verify both signatures and rehearse real rollback
        shell: pwsh
        run: ./apps/desktop/scripts/test-meu-rollback.ps1 -Scenario '${{ matrix.scenario }}'
      - name: Preserve bounded diagnostics without profile contents or installers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Meu-Windows-automatic-rollback-evidence-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/meu-rollback/*.json
            ${{ runner.temp }}/meu-rollback/*.log
          if-no-files-found: ignore
          retention-days: 30
