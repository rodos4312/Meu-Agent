name: Meu isolated cold boot infrastructure proof

on:
  push:
    branches: [dev/meu-foundation]
    paths: [.github/workflows/meu-cold-boot-proof.yml]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  cold-boot:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'rodos4312/Meu-Agent' && github.ref == 'refs/heads/dev/meu-foundation'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
      - name: Prove reporting survives a real reboot of this disposable VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./apps/desktop/scripts/test-meu-cold-boot-host.ps1

  attest-proof:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'rodos4312/Meu-Agent' && github.ref == 'refs/heads/dev/meu-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Observe the independent receipt and retire an unanswered proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = 'https://api.github.com/repos/rodos4312/Meu-Agent'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          identity = 'meu-cold-boot-' + os.environ['GITHUB_RUN_ID']
          def request(path, body=None):
              req = urllib.request.Request(base + path, headers=headers,
                  data=json.dumps(body).encode() if body else None, method='PATCH' if body else 'GET')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          deadline, found = time.monotonic() + 600, None
          while time.monotonic() < deadline:
              rows = request('/commits/' + os.environ['GITHUB_SHA'] + '/check-runs')['check_runs']
              found = next((row for row in rows if row.get('external_id') == identity), None)
              if found:
                  break
              time.sleep(5)
          if not found:
              raise SystemExit('No cold-boot test checkpoint was admitted')
          deadline = time.monotonic() + 480
          while time.monotonic() < deadline:
              found = request('/check-runs/' + str(found['id']))
              if found['status'] == 'completed':
                  print(found['output']['summary'])
                  raise SystemExit(0 if found['conclusion'] == 'success' else 1)
              time.sleep(5)
          request('/check-runs/' + str(found['id']), {'status': 'completed', 'conclusion': 'failure',
              'output': {'title': 'No verified cold-restart receipt',
                  'summary': 'The isolated VM did not report a new OS boot within the bounded proof window.'}})
          raise SystemExit('Cold restart remains unverified')
          PY
