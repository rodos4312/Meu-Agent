name: Meu Android compatibility

on:
  push:
    branches: [dev/meu-foundation]
    paths:
      - 'apps/android/**'
      - 'apps/desktop/assets/meu-icon.png'
      - 'gateway/mobile_preview.py'
      - 'gateway/mobile_relay*.py'
      - 'gateway/run_api.py'
      - 'gateway/session_policy.py'
      - 'hermes_cli/web_routers/mobile_preview.py'
      - 'tests/gateway/test_mobile_preview.py'
      - 'tests/gateway/test_mobile_relay.py'
      - 'tests/gateway/fixtures/mobile_preview_daemon.py'
      - '.github/workflows/meu-android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-pairing:
    if: github.repository == 'rodos4312/Meu-Agent' && github.ref == 'refs/heads/dev/meu-foundation'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          # The full Desktop runtime includes aiohttp through the messaging extra.
          extras: '["messaging"]'
          test-environment: 'true'
          packages: git,ripgrep
      - name: Verify one-time pairing and a canonical Meu turn on Windows
        shell: bash
        run: scripts/run_tests.sh -j 1 tests/gateway/test_mobile_preview.py tests/gateway/test_mobile_relay.py -- --override-ini=addopts= -q

  apk:
    name: Legacy Android companion compilation (no distribution)
    if: github.repository == 'rodos4312/Meu-Agent' && github.ref == 'refs/heads/dev/meu-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and verify the Android preview APK
        run: bash apps/android/build-preview.sh
      # This is the legacy Java companion, not the current private Flutter app.
      # Compile for compatibility only; a normal source push must not distribute
      # another APK or be mistaken for Meu Mobile acceptance/release evidence.
